name: E2E Tests

# Playwright visual regression against Storybook — the design system's primary
# defect gate (pixel drift is THE defect class here).
#
# Shape note (why there is no workflow-level `paths:` filter any more): a
# workflow-level filter means the workflow never STARTS on an excluded PR, so a
# required status check on one of its jobs stays pending forever and blocks the
# PR. The path decision therefore lives in the `changes` job below, and the
# always-run `visual_gate` aggregator is the stable check name to require. Same
# shape as sidekick-web's `ci.yml` `storybook_gate`.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Pixel drift can arrive without a source change (a transitive dep bump, a
  # Chromium/Playwright image change). A nightly full run catches that.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect visual-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # schedule / workflow_dispatch have no diff base, so force the full run.
      visual: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.visual == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            visual:
              - 'src/**'
              - 'e2e/**'
              - '.storybook/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - '.github/workflows/e2e.yml'

  e2e:
    name: Playwright E2E (Storybook visual regression)
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  visual_gate:
    name: Visual regression gate
    needs: [changes, e2e]
    # `!cancelled()` rather than the implicit `success()` over `needs`: a
    # skipped job never satisfies a required status check, so this job must run
    # even when the matrix above did not, and decide explicitly.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Aggregate the visual regression result
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "visual regression result: $RESULT"
          case "$RESULT" in
            success)
              echo "Visual regression suite passed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped)
              # `changes.outputs.visual` was false — nothing that can move a
              # pixel was touched (e.g. a README-only PR). Pass, or a required
              # check would block every docs-only PR forever.
              echo "No visual-affecting changes — Playwright suite did not need to run." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Visual regression did not pass (result: $RESULT). Download the playwright-report artifact for the pixel diffs."
              echo "Visual regression FAILED (result: $RESULT)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
