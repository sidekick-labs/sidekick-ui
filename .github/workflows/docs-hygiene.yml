name: Docs Hygiene

# Thin caller for the org-shared docs-hygiene gate in sidekick-labs/.github
# (sidekick-labs/.github#201). Enforces rule 5 of the docs-shape convention:
# https://github.com/sidekick-labs/octo-brain/blob/main/.claude/conventions/docs-shape.md
#
# Checks CLAUDE.md, AGENTS.md, docs/**, .claude/** and .agents/** for broken links
# and backticked paths, docs/ frontmatter, the index shape and orphan docs. Agents
# follow docs, and docs rot silently; this is the deterministic gate that lets
# docs-only PRs skip Claude review. Decision: sidekick-labs/octo-brain#573.
#
# No `paths:` filter on purpose: the check is fast, and a filtered-out run cannot
# report the check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: docs-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-hygiene:
    permissions:
      contents: read
    uses: sidekick-labs/.github/.github/workflows/docs-hygiene.yml@main
    with:
      mode: warn # flip to `block` after one warn-only cycle (octo-brain#573)
