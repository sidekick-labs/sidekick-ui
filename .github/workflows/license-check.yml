name: License Check

# Licence check over this repo's lockfiles, against the org licence policy
# (sidekick-labs/.github license-check.yml). Pinned to the merge commit of
# sidekick-labs/.github#231 on main (scope step: skips the scan on PRs that
# change no lockfile, so it can be a required check without stalling other PRs).
# Licence audit 2026-11-10 follow-up.
on:
  # Every PR, no paths filter, so it can be a required check. The reusable job
  # skips the scan in seconds when no lockfile changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/package-lock.json'
      - '**/Gemfile.lock'
      - '**/uv.lock'
      - '**/requirements*.lock'
      - '.github/workflows/license-check.yml'
  # Weekly, so a dependency relicensed upstream surfaces without a lockfile change.
  # Monday 05:37 UTC, ahead of sre-brain's compliance watch (06:17), whose check (h)
  # reads this workflow's latest main run and its licence-check-counts artifact.
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  license-check:
    uses: sidekick-labs/.github/.github/workflows/license-check.yml@352d20b6dbcd0586781242c5f36da3025904cf67 # main (sidekick-labs/.github#231)
    permissions:
      contents: read
    with:
      exceptions: ''
