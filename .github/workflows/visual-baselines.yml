name: Visual Baselines

# Regenerate the Playwright/Storybook visual baselines ON LINUX and publish them
# as an artifact.
#
# WHY THIS EXISTS: baselines are rasterised PNGs. A baseline generated on macOS
# has different font hinting and antialiasing from the ubuntu-latest runner, so
# committing a locally-generated snapshot guarantees a permanent false diff in
# CI. The only safe way to add or refresh a baseline is to generate it on the
# same platform CI compares against — this workflow.
#
# HOW TO USE
#   1. Add/adjust the tests in `e2e/storybook.spec.ts`.
#   2. Push the branch (any `visual-baselines/**` branch triggers this), or run
#      it from the Actions tab (workflow_dispatch, once it is on main).
#   3. Download the `visual-baselines` artifact from the run.
#   4. Unzip it over `e2e/storybook.spec.ts-snapshots/`, eyeball every PNG, then
#      commit them yourself (signed) — the runner deliberately does not push.
#
# Nothing here writes to the repo: a runner commit would be unsigned and the
# `required_signatures` rule on main would then block the PR.
on:
  workflow_dispatch:
  push:
    branches:
      - 'visual-baselines/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    name: Regenerate visual baselines (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        # --update-snapshots rewrites existing baselines and writes missing
        # ones. Retries are pointless when every assertion is being rewritten.
        run: npx playwright test --update-snapshots --retries=0

      # Regenerate a SECOND time and compare the two regenerations to EACH
      # OTHER. That is the only comparison that answers "does this render
      # deterministically?", and it is the one that was missing.
      #
      # native-experiences-brain#726 compared a regeneration against the
      # COMMITTED baselines instead, got "identical: 32 / DIFFERENT: 2", and
      # read it as two non-deterministic cases. It was two stale baselines: the
      # run-to-run check below reports identical=34 different=0 on that same
      # commit. A stale baseline and a genuinely flaky case fail the
      # committed-set comparison identically, so that comparison cannot tell
      # them apart — and the flake reading is the one that costs you the gate.
      #
      # Fails the job rather than warning: an artifact of baselines that do not
      # reproduce is not safe to commit, and handing over trustworthy pixels is
      # the entire job of this workflow.
      - name: Verify the baselines reproduce (regenerate again, compare to the first)
        run: |
          cp -r e2e/storybook.spec.ts-snapshots /tmp/gen1
          npx playwright test --update-snapshots --retries=0
          identical=0
          different=0
          for f in /tmp/gen1/*.png; do
            name=$(basename "$f")
            if cmp -s "$f" "e2e/storybook.spec.ts-snapshots/$name"; then
              identical=$((identical + 1))
            else
              different=$((different + 1))
              echo "::error::$name did not reproduce — it renders differently between two runs on this same runner."
              echo "- NON-DETERMINISTIC: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "run-to-run: identical=$identical different=$different" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$different" -ne 0 ]; then
            echo "::error::$different baseline(s) are genuinely non-deterministic. Do NOT commit this artifact as-is."
            exit 1
          fi

      # Informational, and deliberately NOT a failure: every baseline this run
      # legitimately refreshes appears here. This is the STALENESS report — the
      # PNGs whose committed bytes are out of date. Read it as "what this
      # artifact would change", never as "what is flaky".
      - name: Report which committed baselines this run would change
        if: ${{ !cancelled() }}
        run: |
          echo "### Committed baselines this artifact would change (staleness, NOT flakiness)" >> "$GITHUB_STEP_SUMMARY"
          changed=$(git diff --name-only -- e2e/storybook.spec.ts-snapshots/ | wc -l)
          git diff --name-only -- e2e/storybook.spec.ts-snapshots/ \
            | sed 's#.*/#- `#; s#$#`#' >> "$GITHUB_STEP_SUMMARY"
          echo "changed=$changed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: e2e/storybook.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: error
