name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Lint + Test + Compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Run TypeScript type check
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  # Lives here — NOT in e2e.yml — deliberately. This job is a required status
  # check on main, and e2e.yml is workflow-level path-filtered: a workflow that
  # never triggers never reports its check at all, so GitHub leaves the required
  # context pending forever and PRs touching only .github/** or docs can never
  # merge. Under CI's unfiltered `pull_request` trigger it runs (and reports) on
  # every PR. Keep the `name:` byte-identical to the required-check context.
  a11y:
    name: Storybook story tests (render + interaction + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `@storybook/addon-vitest` mounts every story in headless Chromium
      # (Vitest browser mode), runs each story's `play` function, and enforces
      # the addon-a11y axe check — `parameters.a11y.test = 'error'` in
      # .storybook/preview.tsx fails on ANY violation. Vitest spawns Storybook
      # itself, so no build+serve step is needed. This is a sibling to the
      # visual-regression job in e2e.yml and does not touch its snapshots.
      - name: Run Storybook story tests
        run: npm run test:storybook

      - name: Verify Storybook builds
        run: npm run build-storybook
