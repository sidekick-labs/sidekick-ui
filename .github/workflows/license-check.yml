name: License Check

# Report-only licence check over this repo's lockfiles, against the org licence
# policy (sidekick-labs/.github license-check.yml). It writes its findings to the
# job summary and never fails the build; it is not a required check.
# Licence audit 2026-11-10 follow-up. Pinned to the merge commit of
# sidekick-labs/.github#225 on main.
on:
  pull_request:
    paths:
      - '**/package-lock.json'
      - '**/Gemfile.lock'
      - '**/uv.lock'
      - '**/requirements*.lock'
      - '.github/workflows/license-check.yml'
  push:
    branches: [main]
    paths:
      - '**/package-lock.json'
      - '**/Gemfile.lock'
      - '**/uv.lock'
      - '**/requirements*.lock'
  workflow_dispatch:

permissions: {}

jobs:
  license-check:
    uses: sidekick-labs/.github/.github/workflows/license-check.yml@88e0087cef47d7df51afe4b586a7ff74901c05d5 # main (sidekick-labs/.github#225)
    permissions:
      contents: read
    with:
      exceptions: ""
