name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without publishing'
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version $PKG_VERSION is consistent"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x, but OIDC Trusted Publishing (token-free publish
      # via the GitHub id-token) requires npm >= 11.5.1. Without this, the
      # publish PUT fails with a misleading E404 even though provenance signs.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Build package
        run: npm run build

      # All three artifact guards (d.ts type rollup, raw ./theme tokens, tarball
      # contents) live in scripts/verify-dist.mjs so CI runs the SAME checks on
      # every PR. They used to live here only, which meant the first signal of a
      # broken type rollup was a failed publish AFTER the tag and GitHub Release
      # already existed — that is how v0.7.0 was burned (sidekick-ui#122).
      - name: Verify built package is publishable
        run: npm run verify:dist

      - name: Publish package
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "::notice::Dry run — skipping publish"
            npm publish --dry-run --ignore-scripts
          else
            echo "::notice::Publishing @sidekick-labs/ui"
            npm publish --ignore-scripts --provenance
          fi
