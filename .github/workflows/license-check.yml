name: License Check

# Report-only licence check over this repo's lockfiles, against the org licence
# policy (sidekick-labs/.github license-check.yml). It writes its findings to the
# job summary and never fails the build; it is not a required check.
# Licence audit 2026-11-10 follow-up. Pinned to the merge commit of
# sidekick-labs/.github#225 on main.
on:
  # Every PR, so the check can be required; the reusable job skips itself in
  # seconds when the PR changes no lockfile (sidekick-labs/.github, ci/licence-check-always-report).
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/package-lock.json'
      - '**/Gemfile.lock'
      - '**/uv.lock'
      - '**/requirements*.lock'
      - '.github/workflows/license-check.yml'
  # Weekly, so a dependency relicensed upstream surfaces without a lockfile change.
  # Monday 05:37 UTC, ahead of sre-brain's compliance watch (06:17), whose check (h)
  # reads this workflow's latest main run and its licence-check-counts artifact.
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  license-check:
    uses: sidekick-labs/.github/.github/workflows/license-check.yml@0d61c8d200f083fbd386462e595ec162854ace46 # ci/licence-check-always-report (draft; re-pin to the merge commit at land)
    permissions:
      contents: read
    with:
      exceptions: ''
